set timeout=3
set default=0

insmod all_video
set gfxmode=1920x1080x32,1366x768x32,1024x768x32,800x600x32,auto
set gfxpayload=keep

menuentry "EdgeOS" {
    multiboot2 /boot/edgeos.bin console=ttyS0 rw
    boot
}

menuentry "Try EdgeOS (LiveCD Mode)" {
    multiboot2 /boot/edgeos.bin console=ttyS0 rw
    module2 /boot/rootfs.img
    boot
}
